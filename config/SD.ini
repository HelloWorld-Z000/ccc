; Scene Director - cinematic conversation camera
;
; Most keys apply from the next conversation; "(restart)" means a game restart.
; Most are also in the in-game menu (SKSE Menu Framework).
;
; This file is replaced by every update. It holds the defaults and the
; documentation. Changes made in the in-game menu are saved to SD_user.ini next
; to it, which updates never touch and which overrides this file key by key. To
; return a setting to this file's value, delete its line from SD_user.ini.
;
; Turn off: Improved Alternate Conversation Camera, Switch Camera During
; Dialogue, Camera Noise. SmoothCam needs no change.

[Diagnostics]
; Diagnostics. Not in the menu.

; Hold an opening close-up of the player, in milliseconds. 0 is off.
iOpenShotHold=0

; Install the per-frame tick. 0 patches no camera vtable. (restart)
bFrameSource=1

; Log the facegen morph pass for both faces, once a second. Also installs the
; morph hook. (restart)
bLogFaceAnim=0

; Pin one viseme slot open on the player's mouth. -1 off, 0-15 a slot. (restart)
; With 0, the jaw should be visibly stuck open in third person, with no
; conversation or voice mod needed. If it is, the phoneme channel reaches the
; head and any lip sync problem is upstream; if not, the problem is the head
; itself.
iForceViseme=-1

; The same test for the expression channel. -1 off, 0-16 pins that expression on
; your face every frame (look in third person, no conversation needed). If your
; face is stuck in it, the channel reaches your head; if not, nothing can show
; an expression on you (a head replacer without expression morphs, MfgFix
; disabled, or another mod owning your face).
;   0 Anger  1 Fear  2 Happy  3 Sad  4 Surprise  5 Puzzled  6 Disgust  7 Neutral
iForceExpression=-1

[Direction]
; Direct the camera during conversations. This is the mod. Live: the checkbox at
; the top of the Camera page hands the camera back immediately, even
; mid-conversation.
bEnabled=1

; Give first person back at the end, if this mod took it.
bRestoreFirstPerson=1

; Black bars while a conversation is staged. Live from the Screen page.
bLetterbox=1

; The HUD is always hidden during a conversation (bHideInterface and
; bHideHudWholesale were removed and are ignored).
;
; Hidden: every element of the HUD, found from the HUD movie itself rather than
; a list of names, so it covers the compass, meters, crosshair, activate prompt,
; clock, sneak eye and anything a HUD replacer adds.
;
; Kept: notifications (items picked up, gold, skill increases, quest updates)
; still appear while you talk, as do subtitles and the topic list.

; --- Camera movement ---------------------------------------------------------
; Each shot sets its own movement in the Shots panel (iRoomSwing, iDollyAmount
; and iDollyWindow were removed and are ignored):
;
;   i<Shot>Move        (Effect) 0 None, 1 push in, 2 pull out,
;                      3 crane up, 4 crane down, 5 tilt up, 6 tilt down,
;                      7 drift, 8 zoom in, 9 zoom out,
;                      10 orbit left, 11 orbit right, 12 slide left,
;                      13 slide right
;   i<Shot>MoveAmount  (Amount) 0-100, a percentage of that effect's full travel
;   i<Shot>MoveTime    (Duration) hundredths of a second for it to finish
;
; Orbit arcs around the subject while pointing at them, so the room slides
; behind them. Slide moves the camera sideways without turning, so the subject
; drifts across the frame.
;
; These are written by the menu and not listed here. A saved i<Shot>Zoom of 1 or
; 2 from older versions is migrated to the matching move once.

; --- The topic list ----------------------------------------------------------
; This mod never touches dialogue input. Clicks behave exactly as in vanilla.
;
; The list follows the dialogue menu's own state,
;   greeting -> topic list -> topic clicked -> transitioning -> topic list
; and is hidden whenever that state isn't "topic list". The settings below only
; shape the fade (plus the hold for your own voiced line); the game decides when
; the options are live.

; Fade your options out while someone speaks, and back in when it's your turn.
; The list isn't hidden until the game has shown it once, so the opening
; greeting is left alone.
bFadeTopicList=1

; Hold your options on screen while your own voiced line plays, and have them
; gone by the time it ends: when the line's length is known the fade runs over
; its last moments, otherwise it starts as the line ends. 1 holds, 0 fades at
; the click.
;
; Only matters with a player-voice mod. Dragonborn ReVoiced reports when your
; line ends (including a skipped line); under DBVO or vanilla it's read from
; your character's sound handles. The hold is capped at fifteen seconds in case
; the end is never reported.
;
; Replaces bHideChoicesWhilePlayerSpeaks, which is no longer read (its stored
; value meant the opposite of its label, so it isn't migrated).
bFadeAfterPlayerLine=1

; Hundredths of a second the spent list is held before it starts fading, once
; your line has finished. 0 fades it the moment you pick.
iChoiceFadeDelay=150

; Hundredths of a second the spent list takes to fade. Fading back in is a
; separate, gentler 0.55 s.
iChoiceFadeTime=200

; Hundredths of a second before the list eases back in once the game has rebuilt
; it. Only there to stop it flickering.
iListReturnDelay=20

; The opening greeting never hides the list, and there's no setting for it:
; Accept commits the highlighted topic whether the list is visible or not, so a
; hidden list would let the click that starts a conversation pick a topic you
; never saw. The game already brings the list back while the NPC is finishing
; their last line, so the options are ready as the line ends.

; Hide the speaker name vanilla prints beside the list. Follows the topic list
; fade; without this the name would be left alone in an otherwise empty frame.
bHideSpeakerName=1

; ---------------------------------------------------------------------------
; Direction dials. Times are hundredths of a second, so 240 means 2.40s.
; ---------------------------------------------------------------------------

; Conversations open on whoever is speaking, or on you when nobody is
; (bOpenOnSpeaker was removed).

; bCutOnLineEnd was removed: a line ending is no longer a reason to cut. The
; shot a line was framed on holds through the pause after it.
;
; The camera still moves to whoever starts speaking when the shot on screen
; frames the wrong person. That doesn't count toward the line count below.

; --- Per line angle changes --------------------------------------------------
; The first of two independent ways the camera takes a new angle.

; Count lines and change angle after enough of them.
bPerLineAngleChange=1

; How many lines, re-rolled between the two after every change so the rhythm
; isn't predictable. Resets with every reply.
iCutEveryMin=3
iCutEveryMax=6

; Whether very short lines count toward the tally. 1 ignores them, so a run of
; "Yes." and "Hmm." doesn't move the camera toward its next angle.
bHoldOnShortLines=1

; What counts as short, in words. Read only when above is 1.
iShortLineWords=4

; --- Timed angle changes -----------------------------------------------------
; The second way, independent of the first. Both off by default, so every angle
; change has a reason.

; Whether the timer may fire, for each side of the exchange.
bTimedCutsWhileSpeaking=0
bTimedCutsWhileChoosing=0

; How long an angle may stay before either timer changes it, in hundredths of a
; second. Only used when at least one timer is on.
iMaxShotTime=900

; --- Holds -------------------------------------------------------------------
; Floors under normal angle changes. Subject obstruction recovery can cut sooner.

; How long an angle must hold before a normal cut may change it.
iMinShotTime=240

; The floor when the conversation passes between the two of you. Not a pacing
; control.
iMinTurnTime=25

; Always cover your own turn, rather than the room.
bCoverPlayerTurn=1

; Never swing an angle across the eyeline while looking for room. This keeps
; each shot off the line; bTrue180 keeps the whole conversation on one side. 0
; restores the behaviour from before 1.3.3.
bEnforceLine=1

; True 180-degree rule: you are filmed over one shoulder and they are filmed
; over the opposite one, so the camera never crosses the line. Implies
; bEnforceLine.
bTrue180=0

; Close-ups and tighter singles frame where the face actually is, still anchored
; to the person: lower and further forward when they lean over something, and
; turned toward the way the face points, up to 35 degrees. Decided when the shot
; cuts and held. Humanoids only. 0 frames the head where it was when the
; conversation opened.
bFollowFace=1

; Prefer shots without someone standing across the sightline. The collision
; probes ignore actors, so this checks them separately (a short loop over nearby
; actors per angle, no physics). Turn off in very crowded cells if needed. Keep
; Subject Visible always checks actors, whatever this is set to.
bAvoidCrowds=1

; Require a readable subject and check visibility while the shot plays.
;
; Only objects between the lens and the subject's protected face region count
; as obstructions. Foreground objects beside the face, or covering only the
; lower torso, may remain in the shot. Lens collision is checked separately.
; Chooses among clear enabled shots using the existing shot preferences.
; Always includes actor checks, even with bAvoidCrowds=0.
;
; Off by default so existing camera preferences keep their behavior. Turning it
; on in the menu turns bHoldPlacement off. If both are 1 in the INI, the saved
; bHoldPlacement preference wins and subject protection stays off.
; Detection uses collision geometry and actor approximations; collisionless
; decorations and exact rendered transparency are not detected reliably.
bKeepSubjectVisible=0

; With Keep Subject Visible on, use first person if no clear enabled shot can
; be found. The conversation continues; cinematic coverage returns only after
; clearance is sustained. The player's own first-person view may also be blocked.
; Off can hold the current enabled shot even if obstructed. If that shot is
; disabled or has no valid pose, the normal game camera takes over.
bFirstPersonFallback=1

; Stop checking for obstructions once the angle has been chosen.
;
; Off: the camera keeps measuring the room every frame, which keeps it out of
; geometry the conversation walks into, but also makes it ease in and back out
; when someone walks past.
;
; On: every check runs when the angle is chosen, then the shot holds and things
; can pass through the frame. If you walk while talking, the camera follows at
; its chosen distance and bearing, through whatever is in the way. Best in
; crowds, worst in a conversation that moves. Also cheaper.
;
; Can't be combined with Keep Subject Visible. Enabling either in the menu turns
; the other off; this key wins if both are 1 in the ini.
bHoldPlacement=0

; ---------------------------------------------------------------------------
; Keys, while a conversation is on screen. DirectX scan codes; 0 is unassigned.
;
; All ship unassigned; set them on the Keys page in the menu, which captures
; whatever you press. (iKeyRelease was removed; use bEnabled above.)

; Change the angle now, without waiting.
iKeyNextAngle=0

; Switch who the camera looks at. The first press goes to whoever isn't on
; screen; press again to keep cycling. Returns to automatic at the end of the
; turn.
iKeyFraming=0

; Film the conversation in front of you, or stop filming it. Works outside your
; own conversations: two NPCs talking near you, or one talking to you, are
; filmed like your own conversation. Moving, a menu, combat or your own
; conversation hands the camera back.
iKeyFilmScene=0

; Bar height, thousandths of screen height each. 120 is 12% of the frame per
; bar; the menu draws it as a percentage.
iLetterboxHeight=120

; Subtitles in the black bar: the spoken line sits centred in the bottom bar and
; follows it as it eases in and out. With no bar, or one too thin for the text,
; it goes back over the picture. While on, the bars are drawn beneath the
; interface instead of over it.
bSubtitlesInBar=0

; Hundredths of a second held on you before cutting to the reply.
; Delete this line to let it choose for itself.
; iPlayerBeat=45

; Voiced player lines: hundredths of a second to stay on you after your line
; ends before cutting to them. 0-300; 0 cuts immediately. Only covers the
; silence before their reply. Under ReVoiced the reply follows at once unless
; its post-line delay is set.
iPlayerVoiceHold=0

; Reaction shots: after every iReactionEvery of their lines (1-10) in a reply,
; an iReactionChance percent (0-100) chance that their next line is shown on
; you. Skips short and full-intensity lines; automatic framing only. Counts
; reset with every reply.
bReactionShots=0
iReactionEvery=3
iReactionChance=50

; Persuasion beat: when you persuade, intimidate or bribe, their answer cuts to
; a close-up of them, held for the whole reply while the camera pushes in.
; Detected from the reply's conditions, so it works in any language.
bPersuasionBeat=1

; Film two NPCs talking to each other once you've stood still within iSceneRange
; units (150-2000) of them, with them in front of you, for iSceneWait hundredths
; of a second (0-600). It has to be a real conversation (two voices in the same
; scene, or a quick back-and-forth). Moving hands the camera back. iKeyFilmScene
; works with this off.
bFilmScenesAuto=0
iSceneRange=600
iSceneWait=150

; ---------------------------------------------------------------------------
[Shots]
; Which setups the picker may draw, and how each one behaves.
;
; Ten keys per setup. Only the first is listed below; the others are written
; when you change a setup in the menu (Shots) or apply a preset. The menu name
; is in brackets. Key names never change; menu names may be reworded.
;
;   b<Name>            1 on, 0 off
;   i<Name>Weight      (Frequency) 0-100, how often it's drawn against the
;                      others in its group. Double the number is double as
;                      often; 0 means never. Staples ship at 100, accents at
;                      50; the editor's Default button restores a setup's own.
;   i<Name>Fov         (FOV) field of view in degrees, 20-150.
;   i<Name>Move        (Effect) what it does while on screen. 0 is None, then
;                      push in, pull out, crane up/down, tilt up/down, drift,
;                      zoom in/out, orbit left/right, slide left/right.
;   i<Name>MoveAmount  (Amount) 0-100, how much of that effect happens; means
;                      the same for every effect. 0 and unused with None.
;   i<Name>MoveTime    (Duration) how long the effect takes, in hundredths of a
;                      second. 400 and unused with None (fixed so presets
;                      compare cleanly).
;   s<Name>Light       which lighting look this angle uses, by name: off,
;                      natural, soft, hard or edge. See [Lighting]. An unknown
;                      name falls back to the angle's default and is logged.
;   i<Name>LightX      this angle's own light nudge, added to the global one.
;   i<Name>LightY      Same axes as [Lighting] iOffsetX/Y/Z: across the frame,
;   i<Name>LightZ      toward or past the subject, and down or up. -400 to 400.
;
; The four light keys only apply with [Lighting] bPerShot=1. Off (the default),
; every angle uses the look and nudge set in [Lighting]. There's no Light page
; in the menu; with bPerShot set by hand, the shot editor gets a Light section.
;
; The look key is stored as a name (hence the s), so adding a look to the list
; doesn't change any angle's lighting.
;
; i<Name>Zoom (0 none, 1 zoom in, 2 zoom out) is from before 1.3. It's read once
; to carry the choice over to i<Name>Move and ignored after that.
;
; A preset writes all ten keys for every setup it uses: the same angle at 40
; degrees and at 95 is a different image, and the weights decide whether a look
; is mostly faces or mostly room. Everything a preset writes stays editable.
;
; Whoever is speaking always gets the camera, whatever is off here.
; ---------------------------------------------------------------------------

; What ships on: the angles of the Close preset, so a clean install shows Close
; on the Presets page. Turn on others on the Shots page or apply another preset;
; your choices are saved to SD_user.ini.
;
; The other per-angle keys (frequency, FOV, effect, amount, duration, light and
; the light nudges) aren't listed here. The menu and presets write them; when
; they're missing, each angle uses Close's values.

; --- NPC: them, while they speak -------------------------------------------

; Over Your Shoulder, at four heights. The plain one is in Close; the wide one
; needs room.
bOverPlayerShoulder=1
bOverPlayerShoulderLow=0
bOverPlayerShoulderHigh=0
bOverPlayerShoulderWide=0

; The tight over-the-shoulder, and Three Quarters.
bDirtyNpc=0
bThreeQuarterNpc=0

; The close range. Extreme Close Up is reserved for full-intensity lines.
bCloseUp=1
bExtremeClose=1
bCloseLow=0
bCloseHigh=0
bCloseProfile=0
bCloseWide=0

; Head And Shoulders, and looser.
bMediumNpc=0
bMediumProfile=0
bLowAngle=0
bLowProfile=0

; Wide. Both need room.
bLongNpc=0
bOverhead=0

; --- PC: you, while you choose ---------------------------------------------

; Over Their Shoulder at you, matching the four heights above.
bOverNpcShoulder=0
bOverNpcShoulderLow=0
bOverNpcShoulderHigh=0
bOverNpcShoulderWide=0

; The rest of your side, at matching sizes.
bDirtyPlayer=0
bThreeQuarterPlayer=0
bClosePlayer=1
bExtremeClosePlayer=1
bMediumPlayer=0
bPlayerProfile=0
bPlayerLow=0
bHighAngle=0
bLongPlayer=0
bPlayerOverhead=0

; --- Room: the space around you --------------------------------------------
; What turns a long pause into a look around the space.

; Both of you in frame.
bTwoShot=0

bProfile=0
bWide=0

; The whole space from up and back, and from near the floor.
bMaster=0
bGroundLevel=0

; Across the room on a long lens. The one wide angle Close keeps, drawn about
; one line in twenty-six.
bDistant=1
bDistantLow=0

; bTwoShotLow/High/Wide, bAnchored and bAnchoredHigh were removed and are
; ignored.

[Performance]
; Player expressions. Conversational action and emotional tone are handled
; separately: questions, confirmations, skepticism and statements each get their
; own upper-face pose, explicit English cues set the player's tone, and authored
; NPC emotions take priority. Timing is estimated from word distribution within
; the voice line (not word-synced), and voice tone isn't analysed. Neutral NPC
; lines don't inherit an earlier listener emotion.
;
; Live under Faces. Each expression profile is a complete upper-face pose; the
; mouth's lip sync is separate. Override profiles with [Expression.Inquiry],
; [Expression.Happy] and so on in SD_user.ini, using iBrowLiftLeft/Right
; (-100..100; negative lowers, positive raises), iBrowInLeft/Right and
; iSquintLeft/Right (0..100), iRegionEmotion (0..7) and iRegionStrength
; (0..100). Missing values use the built-in defaults. Neutral statements add no
; pose by default.
bExpressions=1
; Expression strength is fixed at 1.50 with a soft ceiling (iExpressionStrength
; is ignored). Fuller expressions while silently listening, with speech taking
; priority. 0 for upper-face only.
bCinematicListening=1
; Extra eye and upper-cheek morphs, currently for the HPH female head. Needs the
; matching .sduf asset; other heads keep the brow and squint motion.
bRegionalExpressions=1

; When your voiced line starts, send DBVO's PlayDBVOTopic event, so a DBVO
; player-gesture add-on gestures while you speak. Gesture mods keyed on OAR's
; "player has chosen" condition still wait for the reply. Not sent while DBVO 1
; is loaded, since it sends its own.
bPlayerGestureCue=1

; Someone at a workbench, smelter, forge, tanning rack, chopping block or
; similar steps away from it 3 to 5 seconds after they start talking, and goes
; back to it afterwards. Seats, beds and quest scenes are left alone.
bStopWorkToTalk=1

; bGaze, iListenerGaze, iSpeakerGaze and bHoldPlayerFace are retired and
; ignored.

; Lip sync fallback: moves the player's mouth while a player-voice mod speaks
; their line. Both settings are in the menu under Faces.
;
; SpeakSound plays the audio but never applies the .lip track inside the .fuz,
; so the mouth would stay shut. This only writes while your own voice line is
; playing, so it does nothing without a voice mod like DBVO or DBReV.
;
; On by default for DBVO 1 and DBVO 2. Dragonborn ReVoiced moves your mouth
; itself (it knows the file, the length and when a line is cut short), so
; ReVoiced users can turn this off.
bSynthLipSync=1

; Overall mouth movement, as a percentage. Mostly affects the jaw; the lips keep
; more of their movement as it goes down, since they're what make the mouth look
; like it's forming words. 55 is conversational; high values look like shouting.
iLipSyncStrength=55

; bBrowSync and iBrowStrength are retired and ignored. Brow movement comes from
; the Expression.* profiles and follows bExpressions.

; Point both participants at each other during a conversation, using the
; engine's own head tracking. Set to 0 first if your character's animation
; misbehaves.
bHeadtracking=1

; ---------------------------------------------------------------------------
[Lighting]
; ---------------------------------------------------------------------------
; Put a light on whoever the shot is on, so faces stop looking flat.
;
; Experimental, and only available from this file (there's no Light page in the
; menu, and no preset turns it on). Off by default: it's the one part of the mod
; that changes how the game looks rather than how it's shot.
;
; Nothing here loads a form, writes to your save or replaces a shader. The
; lights are created when a conversation opens and removed when it closes.
;
; Named bLights rather than bEnabled because key names in this file must be
; unique across sections; settings are merged by key name on update.
bLights=0

; How bright, as a percentage.
iBrightness=100

; What color, 0-255 per channel. In the menu this is a color picker.
;
; This is the color, not the amount; brightness comes from iBrightness above.
; All three channels at 255 is white, not a brighter light.
;
; The default is a warm white, like most Skyrim interiors. Some starting points:
;
;   255 246 234   warm white - candles, hearths, most interiors (default)
;   255 255 255   neutral white
;   214 228 255   moonlight - exteriors at night, ice caves
;   255 214 158   firelight - strong amber, close to a torch
;   198 255 214   wisp green - Falmer halls, anything sickly
;   224 208 255   arcane - mage colleges, soul gems
iRed=255
iGreen=246
iBlue=234

; Which look. One of:
;
;   off       no added light at all
;   natural   a gentle lift on the face; safe anywhere, hard to notice
;   soft      broad and forgiving; low contrast, flattering
;   hard      one strong side light, nothing filling the shadow
;   edge      no key at all; shape from behind, face left in shadow
;
; They differ only in shape; the color is set above.
sLook=natural

; --- Moving the light --------------------------------------------------------
; World units, relative to the shot rather than the world, so the light stays
; in the same place in frame through cuts, reverses and a conversation that
; moves around.
;
;   iOffsetX   left and right across the frame
;   iOffsetY   toward the camera (negative) or past the subject (positive)
;   iOffsetZ   down and up
;
; -400 to 400 each. 0 is wherever the look puts it.
iOffsetX=0
iOffsetY=0
iOffsetZ=0

; Give every angle its own look and nudge, set per angle in the menu under
; Shots. Off, they all share the settings above.
;
; The per-angle keys are s<Name>Light, i<Name>LightX, i<Name>LightY and
; i<Name>LightZ (see [Shots]). They're read either way, so switching this on
; applies from the next conversation.
bPerShot=0

; --- Advanced ----------------------------------------------------------------
; Not in the menu.

; Every light casts real shadows. By far the most expensive setting in the mod,
; for a difference most people won't notice.
bShadows=0

; How long the light takes to change when the angle does, in hundredths of a
; second. 0 snaps.
iFadeTime=18

; --- Depth of field ----------------------------------------------------------
; Uses VATSImodDOF from Skyrim.esm (an unused leftover present in every
; install), so no plugin file is needed. Independent of the light above.
bDepthOfField=0

; How much blur, as a percentage.
iBlur=55

; Retired and ignored: iWarmth (replaced by the color channels above),
; iMasterScale, bEmotionShifts, every key starting with a look name
; (iSoftKeyIntensity, iHardRimRadius and so on), and the [LightRigs] and
; [LightEmotion] sections.

; ---------------------------------------------------------------------------
[Presets]
; ---------------------------------------------------------------------------
; Apply a named look once, on the next game start. For setups without SKSE Menu
; Framework. The key clears itself.
;
; The names below are the ini values and never change; the menu names are in
; brackets.
;
;   standard   (Standard)  Over the shoulder, then close on whoever is talking.
;   close      (Close)     Tight on faces. The default: this file already
;                          ships Close's settings.
;   room       (Room)      Where you are, more than who is talking.
;
; An installed preset can be named here too, by its name or its file name.
; Installed presets are .json files in SKSE/Plugins/SceneDirector/Presets/,
; usually from a preset mod; the Presets page lists them and exports your own.
; The format is described in USAGE.md.
;
; No preset touches lighting, the letterbox, or whether your own turn is
; covered. Everything a preset sets stays editable afterwards.
sApply=

[CustomPresets]
; ---------------------------------------------------------------------------
; Three slots for your own settings, saved from the Presets page in-game. Unlike
; the built-in looks, a slot is a snapshot of whatever you had set up.
;
; sSlotNName is the name and is safe to edit. sSlotN is the snapshot itself
; (timing settings, then four numbers per angle). It's written by the menu and
; isn't meant to be edited; to change a slot, set things up and save over it.
;
; Clearing both lines empties a slot. A snapshot from a build with a different
; set of angles is refused rather than applied wrongly.
sSlot1Name=
sSlot1=
sSlot2Name=
sSlot2=
sSlot3Name=
sSlot3=
